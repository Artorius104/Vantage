[project]
name = "vantage"
version = "0.1.0"
description = "Enterprise Knowledge Copilot answering only from what each Rôle may see"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5",
  "pyyaml>=6",
  "qdrant-client>=1.12",
  "sentence-transformers>=3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
